{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block body %}
<main class="home">
  <h1>Welcome{% if user.first_name %}, {{ user.first_name }}{% endif %}!</h1>
  <p>You're signed in as {{ user.username }}.</p>
  <form method="post" action="{% url 'accounts:logout' %}">
    {% csrf_token %}
    <button type="submit" class="btn-pill btn-pill--small">LOG OUT</button>
  </form>
</main>
{% endblock %}
